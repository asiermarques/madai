{{ define "main" }}
<section id="body-details">
    <article id="page">
        <div class="container">
            {{ with site.GetPage "/events" }}
            <a href="{{ .RelPermalink }}" class="back">← {{ T "events_back" }}</a>
            {{ end }}
            <div class="row">
                <div class="col-12 col-md-8 offset-md-2">
                    {{.Content}}
                </div>
            </div>
        </div>
    </article>
</section>
{{ end }}
