<footer>
    <div class="container">
        <div class="footer-cta">
            <div class="footer-cta__inner">
                <div class="footer-cta__copy">
                    <span class="footer-cta__kicker">{{ T "cta_talk_kicker" }}</span>
                    <h2 class="footer-cta__title">{{ T "cta_talk_title" }}</h2>
                    <p class="footer-cta__text">{{ T "cta_talk_text" }}</p>
                </div>
                <a class="footer-cta__btn"
                   href="mailto:madai.techcommunity@gmail.com?subject={{ T "cta_talk_subject" | urlquery }}">
                    <span>{{ T "cta_talk_button" }}</span>
                    <span class="footer-cta__arrow" aria-hidden="true">&rarr;</span>
                </a>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                {{ $p := printf "i18n/%s/manifesto.md" .Lang }}
                {{ with resources.Get $p }}
                {{ .Content | markdownify }}
                {{ end }}
            </div>
        </div>
    </div>
</footer>
