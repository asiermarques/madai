baseURL = "https://madai.es"
defaultContentLanguage = 'es'
defaultContentLanguageInSubdir = false
buildFuture = true

[languages]
    [languages.es]
      disabled = false
      locale = 'es'
      label = 'ES'
      weight = 1
    [languages.en]
      disabled = false
      locale = 'en'
      label = 'EN'
      weight = 2
# No taxonomies are used; disable Hugo's default tags/categories
[taxonomies]

[markup]
    defaultMarkdownHandler = 'goldmark'

[outputs]
    home = ['html', 'llms']

[outputFormats.llms]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true
